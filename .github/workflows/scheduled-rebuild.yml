name: Scheduled Content Rebuild

# Journal and Case Study content is edited in the /admin panel (Supabase),
# not by pushing code — this rebuild picks up those edits and republishes
# the static site, since GitHub Pages otherwise only rebuilds on a push to
# main (see deploy.yml). Additive: does not replace or modify the
# push-triggered deploy.
#
# Three ways this fires:
#   1. `repository_dispatch` (type: content-updated) — fired automatically
#      by a Postgres trigger (supabase/auto_rebuild_webhook.sql) on any
#      admin-editable table's insert/update/delete, so edits go live within
#      ~30-60s with zero manual steps. This is the primary trigger; see
#      README's "Automatic rebuild on save" section for the one-time
#      Supabase/GitHub setup. The trigger function never lets a failure
#      here (expired token, transient GitHub/pg_net issue) block the
#      actual admin save — see that file's exception handling.
#   2. `schedule` — a safety-net cron in case a webhook call is ever missed
#      (rate limit, transient network failure, an expired GitHub token,
#      etc.), so content can never drift for more than ~5 minutes even if
#      trigger #1 silently fails. 5 minutes is GitHub Actions' own minimum
#      supported schedule interval — this is as tight as this mechanism can
#      go (see "Automatic rebuild on save" in the README for what a real
#      active-retry alternative would look like, if ever needed).
#   3. `workflow_dispatch` — manual "Run workflow" button for on-demand use.
on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '*/5 * * * *' # safety net — every 5 minutes (GitHub's minimum interval)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shares deploy.yml's concurrency group so a push-triggered deploy and a
# scheduled one can never race and clobber each other's Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          # Required — Journal and Case Study pages are generated at build
          # time from Supabase. If these are missing, the build now fails
          # loudly (see src/lib/buildTimeData.ts) instead of silently
          # shipping a site with no Journal/Case Study pages.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/deploy-pages@v4
        id: deployment
