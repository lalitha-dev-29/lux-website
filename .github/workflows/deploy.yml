name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Repo name becomes the base path, e.g. /lux-website/ — matches how
          # GitHub Pages serves a project site at <user>.github.io/<repo>/.
          # Skip this (or set it to "/") if this repo is a <user>.github.io
          # user/org site served from the domain root instead.
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # Set these three as repo secrets (Settings → Secrets and variables →
          # Actions) to enable the /connect/ form to actually send email via
          # EmailJS. Left unset, the form falls back to CV-gate-only behavior.
          PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}
          # Optional: reCAPTCHA v2 site key (see README's "Abuse protection"
          # section). Left unset, the form has no captcha requirement.
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          # Supabase project for the Journal CMS (see supabase/schema.sql and
          # the "Journal CMS" section in the README). Both are meant to be
          # public — safety comes from Row Level Security, not secrecy — but
          # they still live in repo secrets since they're environment-specific.
          # Left unset, the Journal page and /admin panel fail to load data.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/deploy-pages@v4
        id: deployment
