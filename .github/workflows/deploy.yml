name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Repo name becomes the base path, e.g. /lux-website/ — matches how
          # GitHub Pages serves a project site at <user>.github.io/<repo>/.
          # Skip this (or set it to "/") if this repo is a <user>.github.io
          # user/org site served from the domain root instead.
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # Set these three as repo secrets (Settings → Secrets and variables →
          # Actions) to enable the /connect/ form to actually send email via
          # EmailJS. Left unset, the form falls back to CV-gate-only behavior.
          PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.PUBLIC_EMAILJS_SERVICE_ID }}
          PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.PUBLIC_EMAILJS_TEMPLATE_ID }}
          PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.PUBLIC_EMAILJS_PUBLIC_KEY }}
      - uses: actions/deploy-pages@v4
        id: deployment
